# Deploy PulseOS a FTP Taller Boedo
# prod      → carpeta remota pulseOS/
# pre-prod  → carpeta remota PulseOS-prep/
#
# Mismos secrets para prod y pre-prod; solo cambia la carpeta FTP remota.
# FTP_* + PROD_DB_* (+ opcional PROD_APP_URL)

name: Deploy to FTP

on:
  push:
    branches:
      - prod
      - pre-prod
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        required: true
        default: pre-prod
        type: choice
        options:
          - pre-prod
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Instalar dependencias (Composer)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Definir carpeta remota según entorno
        run: |
          if [ "$DEPLOY_BRANCH" = "prod" ]; then
            echo "REMOTE_SUBDIR=pulseOS" >> $GITHUB_ENV
            echo "ENV_LABEL=Producción (pulseOS)" >> $GITHUB_ENV
          elif [ "$DEPLOY_BRANCH" = "pre-prod" ]; then
            echo "REMOTE_SUBDIR=PulseOS-prep" >> $GITHUB_ENV
            echo "ENV_LABEL=Pre-producción (PulseOS-prep)" >> $GITHUB_ENV
          else
            echo "Rama no configurada para deploy: $DEPLOY_BRANCH"
            exit 1
          fi
          echo "Desplegando a: $ENV_LABEL"

      - name: Generar .env (mismos PROD_DB_* para prod y pre-prod)
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
        run: |
          if [ -z "$PROD_DB_HOST" ] || [ -z "$PROD_DB_NAME" ]; then
            echo "PROD_DB_* incompletos: no se genera .env"
            exit 0
          fi
          if [ "$REMOTE_SUBDIR" = "pulseOS" ]; then
            APP_DEBUG=false
            APP_URL="${PROD_APP_URL:-https://tallerboedo.com.ar/pulseOS/public}"
          else
            APP_DEBUG=true
            APP_URL="https://tallerboedo.com.ar/PulseOS-prep/public"
          fi
          {
            echo "APP_NAME=PulseOS"
            echo "APP_ENV=production"
            echo "APP_DEBUG=${APP_DEBUG}"
            echo "APP_URL=${APP_URL}"
            echo "APP_KEY="
            echo "DB_HOST=${PROD_DB_HOST}"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=${PROD_DB_NAME}"
            echo "DB_USERNAME=${PROD_DB_USER}"
            echo "DB_PASSWORD=${PROD_DB_PASSWORD}"
            echo "DB_CHARSET=utf8mb4"
            echo "SESSION_LIFETIME=7200"
          } > .env
          echo ".env generado para ${ENV_LABEL}"

      - name: Preparar artefactos (sin .git ni CI)
        run: |
          rm -rf .git
          rm -rf .github

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}${{ env.REMOTE_SUBDIR }}/
          state-name: .ftp-deploy-sync-state-${{ env.REMOTE_SUBDIR }}.json
          protocol: ftp
          log-level: verbose
          exclude: |
            .git
            .github/**
            .gitignore
            DEPLOY.md
            README.md
            .env.example
            .env.local
            node_modules/**
