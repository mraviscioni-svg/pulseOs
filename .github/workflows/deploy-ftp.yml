# Deploy PulseOS a FTP Taller Boedo
# prod      → carpeta remota pulseOS/
# pre-prod  → carpeta remota PulseOS-prep/
#
# Mismos secrets para prod y pre-prod; solo cambia la carpeta FTP remota.
# FTP_* + PROD_DB_* (+ opcional PROD_APP_URL)

name: Deploy to FTP

on:
  push:
    branches:
      - prod
      - pre-prod
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        required: true
        default: pre-prod
        type: choice
        options:
          - pre-prod
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Instalar dependencias (Composer)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build CSS (Tailwind CLI)
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          ./tailwindcss-linux-x64 -i ./resources/css/input.css -o ./public/assets/css/tailwind.css --minify

      - name: Definir carpeta remota según entorno
        run: |
          if [ "$DEPLOY_BRANCH" = "prod" ]; then
            echo "REMOTE_SUBDIR=pulseOS" >> $GITHUB_ENV
            echo "ENV_LABEL=Producción (pulseOS)" >> $GITHUB_ENV
          elif [ "$DEPLOY_BRANCH" = "pre-prod" ]; then
            echo "REMOTE_SUBDIR=PulseOS-prep" >> $GITHUB_ENV
            echo "ENV_LABEL=Pre-producción (PulseOS-prep)" >> $GITHUB_ENV
          else
            echo "Rama no configurada para deploy: $DEPLOY_BRANCH"
            exit 1
          fi
          echo "Desplegando a: $ENV_LABEL"

      - name: Generar .env (PHP — claves especiales y pulseos.env)
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          REMOTE_SUBDIR: ${{ env.REMOTE_SUBDIR }}
        run: php scripts/generate-env.php

      - name: Preparar artefactos (sin .git ni CI)
        run: |
          rm -rf .git
          rm -rf .github

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}${{ env.REMOTE_SUBDIR }}/
          state-name: .ftp-deploy-sync-state-${{ env.REMOTE_SUBDIR }}.json
          protocol: ftp
          log-level: verbose
          exclude: |
            .git
            .github/**
            .gitignore
            DEPLOY.md
            README.md
            .env.example
            .env.local
            node_modules/**
            package.json
            package-lock.json
            tailwind.config.js
            resources/**
