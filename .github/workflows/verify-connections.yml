# Comprobar secretos FTP y MySQL (manual, no imprime contraseñas)
# GitHub → Actions → Verify connections → Run workflow

name: Verify connections

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secrets FTP
        run: |
          echo "FTP_SERVER: ${{ secrets.FTP_SERVER != '' && 'definido' || 'FALTA' }}"
          echo "FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && 'definido' || 'FALTA' }}"
          echo "FTP_PASSWORD: ${{ secrets.FTP_PASSWORD != '' && 'definido' || 'FALTA' }}"
          echo "FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR != '' && 'definido' || 'FALTA' }}"
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Faltan secrets FTP. Ver docs/GITHUB_SECRETS.md"
            exit 1
          fi

      - name: Comprobar secrets MySQL (PROD_DB_*)
        run: |
          echo "PROD_DB_HOST: ${{ secrets.PROD_DB_HOST != '' && 'definido' || 'FALTA' }}"
          echo "PROD_DB_NAME: ${{ secrets.PROD_DB_NAME != '' && 'definido' || 'FALTA' }}"
          echo "PROD_DB_USER: ${{ secrets.PROD_DB_USER != '' && 'definido' || 'FALTA' }}"
          echo "PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD != '' && 'definido' || 'FALTA' }}"

      - name: Probar MySQL (opcional)
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_DATABASE: ${{ secrets.PROD_DB_NAME }}
          DB_USERNAME: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_DATABASE" ]; then
            echo "MySQL: faltan PROD_DB_HOST o PROD_DB_NAME (opcional en verify)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client > /dev/null
          if mysql -h "$DB_HOST" -P 3306 -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" -e "SELECT 1" 2>/dev/null; then
            echo "MySQL: conexión OK desde GitHub"
          else
            echo "::warning::MySQL: no accesible desde internet (normal en hosting compartido; la app usa localhost en el servidor)"
          fi

      - name: Probar FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -e "set ftp:ssl-allow no; set net:timeout 25; open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; ls; quit"
          echo "FTP: conexión OK"
