# Comprobar secretos FTP y MySQL (manual, no imprime contraseñas)
# GitHub → Actions → Verify connections → Run workflow

name: Verify connections

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que existen los secrets FTP
        run: |
          echo "FTP_SERVER: ${{ secrets.FTP_SERVER != '' && 'definido' || 'FALTA' }}"
          echo "FTP_USERNAME: ${{ secrets.FTP_USERNAME != '' && 'definido' || 'FALTA' }}"
          echo "FTP_PASSWORD: ${{ secrets.FTP_PASSWORD != '' && 'definido' || 'FALTA' }}"
          echo "FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR != '' && 'definido' || 'FALTA' }}"
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Faltan secrets FTP obligatorios. Ver docs/GITHUB_SECRETS.md"
            exit 1
          fi

      - name: Probar MySQL (opcional)
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_DATABASE" ]; then
            echo "MySQL: secrets DB_* no configurados (opcional). Migraciones vía phpMyAdmin."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client > /dev/null
          PORT="${DB_PORT:-3306}"
          if mysql -h "$DB_HOST" -P "$PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" -e "SELECT 1" 2>/dev/null; then
            echo "MySQL: conexión OK desde GitHub"
          else
            echo "::warning::MySQL: no accesible desde internet (normal en hosting compartido)"
          fi

      - name: Probar FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -e "set ftp:ssl-allow no; set net:timeout 25; open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; ls; quit"
          echo "FTP: conexión OK"
